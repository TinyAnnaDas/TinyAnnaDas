<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Tiny P Christhudas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b3d3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#dots)"/>

  <!-- left accent bar -->
  <rect x="0" y="0" width="8" height="360" fill="url(#accent)"/>

  <!-- soft geometric shapes -->
  <circle cx="980" cy="70" r="110" fill="#2dd4bf" opacity="0.08"/>
  <circle cx="1080" cy="260" r="160" fill="#38bdf8" opacity="0.07"/>
  <path d="M760 40 L1180 40 L1180 320 L860 320 Z" fill="#ffffff" opacity="0.02"/>

  <text x="56" y="118" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" letter-spacing="3">
    TINYANNADAS
  </text>

  <text x="56" y="178" fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="700">
    Tiny P Christhudas
  </text>

  <text x="56" y="228" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">
    Full Stack Engineer · Python + React · 4+ YOE
  </text>

  <rect x="56" y="258" width="72" height="4" rx="2" fill="url(#accent)"/>

  <text x="56" y="302" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">
    Django / DRF / FastAPI / Next.js · IIT Madras · previously MrSolvo
  </text>
</svg>
